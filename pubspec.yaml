name: guardian_x
description: "GuardianX - Personal Safety & Threat Detection System"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Camera & Vision
  camera: ^0.10.5+9
  google_mlkit_object_detection: ^0.12.0
  google_mlkit_image_labeling: ^0.11.0

  # Media & File System (Evidence Management)
  path_provider: ^2.1.2
  path: ^1.9.0
  video_player: ^2.8.2
  share_plus: ^7.2.2
  intl: ^0.19.0

  # Location & Emergency Dispatch
  geolocator: ^11.0.0
  url_launcher: ^6.2.5
  telephony: ^0.2.0

  # State & Persistence
  shared_preferences: ^2.2.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true